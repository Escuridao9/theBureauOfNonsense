<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Bureau of Nonsense</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <div class="bureau-shell">
      <main id="game">
        <section
          id="start-screen"
          class="start-screen"
          aria-labelledby="start-title"
        >
          <div class="start-paper">
            <h1 id="start-title" tabindex="-1">
              The Bureau<br /><em>of Nonsense</em>
            </h1>
            <p class="start-tagline">
              Stamp the improbable. File the impossible.
            </p>
            <p class="start-intro">
              Three ways to work. One very important stamp.<br />A desk with
              your name on it.
            </p>
            <nav class="start-actions" aria-label="Campaign-menu">
                <button id="new-campaign-button" class="primary-button" type="button" disabled>New Campaign</button>
                <button id="continue-campaign-button" class="secondary-button" type="button" aria-describedby="campaign-status" disabled>Continue Campaign</button>
                <button id="honours-button" class="secondary-button" type="button" disabled>Roll of Honour</button>
                <button id="settings-button" class="text-button" type="button">Settings</button>
            </nav>
            <p id="campaign-status" class="menu-status" role="status" hidden></p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
